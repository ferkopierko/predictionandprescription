x-common: &common
  build: .
  image: hodnotenie-rizika
  volumes:
    # Dáta a modely z notebookov zostávajú na disku mimo kontajnera
    - ./data:/app/data
    # Databáza hodnotení je vo volume Dockeru, kde spoľahlivo funguje zamykanie SQLite
    - runtime:/app/runtime
  environment:
    HODNOTENIA_DB: /app/runtime/hodnotenia.db
  restart: unless-stopped

services:
  app:
    <<: *common
    container_name: hodnotenie-rizika-app
    ports:
      - "127.0.0.1:8501:8501"

  api:
    <<: *common
    container_name: hodnotenie-rizika-api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/moznosti', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  runtime:
