name: Deploy HronTech to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrontech-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r analysis/requirements.txt httpx2==2.16.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/processed/vcdb_clean.csv
            data/processed/vcdb_predikcie.csv
            data/processed/vcdb_opatrenia_cis.csv
            data/processed/vcdb_register_rizik.csv
            data/processed/model_dopad_vcdb.joblib
          key: vcdb-linux-python313-${{ hashFiles('analysis/*.ipynb', 'hrontech/vcdb_data.py', 'hrontech/vcdb_model.py', 'requirements.txt', 'analysis/requirements.txt') }}
      - name: Prepare data and model
        run: python deploy/azure/prepare_data.py
      - name: Test company and combined web server
        run: |
          python -m unittest discover -s tests -v
          python deploy/azure/verify_local.py
      - name: Package exact commit
        env:
          PAPU_PACKAGE_PATH: ${{ runner.temp }}/hrontech-azure.zip
        run: python deploy/azure/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hrontech-${{ github.sha }}
          path: ${{ runner.temp }}/hrontech-azure.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hrontech-${{ github.sha }}
          path: dist
      - name: Sign in to Azure with GitHub identity
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: afd35cbc-ea3e-42a5-ba60-cc8b0423ac88
          tenant-id: 1c9f27ef-fee6-45f4-9a64-255a8c8e25a5
          subscription-id: 54c15147-3f5f-4adf-9be2-de86976bfb7b
      - name: Deploy application package
        run: >-
          az webapp deploy --resource-group papu-azure
          --name safetyfirst-hrontech-54c15147
          --src-path dist/hrontech-azure.zip --type zip
          --timeout 1200000 --async true --track-status false
      - name: Verify deployed commit and company API
        run: >-
          python3 deploy/azure/wait_for_deployment.py
          --url https://safetyfirst-hrontech-54c15147.azurewebsites.net
          --revision "${{ github.sha }}"
