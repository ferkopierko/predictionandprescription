# Rizikový atlas: jednotný svetlý analytický pracovný priestor.

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
# Písma sú v priečinku static/fonts, aby aplikácia vyzerala rovnako aj bez internetu
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#35586F"
backgroundColor = "#F6F7F8"
secondaryBackgroundColor = "#F3F5F6"
textColor = "#252C32"
borderColor = "#D9E4E9"
dataframeHeaderBackgroundColor = "#F3F5F6"
linkColor = "#35586F"
font = "IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif"
codeFont = "IBM Plex Mono, Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "5px"
buttonRadius = "8px"
headingFontWeights = [700, 650, 600, 600, 600, 600]
showWidgetBorder = true
chartCategoricalColors = ["#35586F", "#6A6C98", "#29546D", "#8A9EAA", "#287A62", "#B87926", "#BE514A"]

# Lokálne písma IBM Plex (licencia SIL OFL, static/fonts/OFL.txt)

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Italic.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Medium.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Bold.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.woff2"
weight = 500
style = "normal"
